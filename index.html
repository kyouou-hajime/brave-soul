// ── パワプロ式 体力(空腹)→成功率 ─────────────────────────────────────────
// 食事は常に成功。その他の行動のみ適用。
function getSuccessRate(hunger, lucBonus) {
  let base;
  if (hunger >= 80) base = 1.00; // 緑ゾーン: 100%
  else if (hunger >= 60) base = 0.98; // 緑ゾーン: ~98%
  else if (hunger >= 40) base = 0.90; // 黄ゾーン: ~90%
  else if (hunger >= 20) base = 0.70; // 橙ゾーン: ~70%
  else if (hunger >= 10) base = 0.50; // 赤ゾーン: ~50%
  else base = 0.25; // 危険ゾーン: 25%
  return lucBonus ? Math.min(1.00, base * 1.05) : base;
}
function getCondLabel(hunger) {
  if (hunger >= 80) return {
    lb: "絶好調",
    c: "#44cc77"
  };
  if (hunger >= 60) return {
    lb: "好調",
    c: "#88dd44"
  };
  if (hunger >= 40) return {
    lb: "普通",
    c: "#ffd700"
  };
  if (hunger >= 20) return {
    lb: "不調",
    c: "#ff8844"
  };
  if (hunger >= 10) return {
    lb: "危険",
    c: "#ff5522"
  };
  return {
    lb: "瀕死",
    c: "#ff2222"
  };
}

// ── TIER-AWARE MASTERY ──────────────────────────────────────────────────
function mRank(pts, tier) {
  if (tier === 1) {
    if (pts >= 30) return 3;
    if (pts >= 20) return 2;
    if (pts >= 10) return 1;
    return 0;
  }
  if (tier === 2) {
    if (pts >= 50) return 3;
    if (pts >= 25) return 2;
    if (pts >= 1) return 1;
    return 0;
  }
  if (tier === 3) {
    if (pts >= 100) return 4;
    if (pts >= 99) return 3;
    if (pts >= 66) return 2;
    if (pts >= 33) return 1;
    return 0;
  }
  if (tier === 4) {
    if (pts >= 100) return 2;
    if (pts >= 50) return 1;
    return 0;
  }
  return 0;
}
function mLabel(pts, tier) {
  const r = mRank(pts, tier);
  if (tier === 3 && r === 4) return "真マスター";
  if (tier === 4) return ["修行中", "アマチュア", "マスター"][r] || "マスター";
  return ["未履修", "アマチュア", "プロ", "マスター"][Math.min(r, 3)];
}
function mShort(pts, tier) {
  const r = mRank(pts, tier);
  if (tier === 3 && r === 4) return "TRUE";
  if (tier === 4) return ["－", "AMT", "MAS"][r] || "MAS";
  return ["－", "AMT", "PRO", "MAS"][Math.min(r, 3)];
}
// Display max for pts bar: tier3 always shows 99 as cap
function dispMax(tier) {
  return tier === 3 ? 99 : TIER_MAX[tier];
}
// Display pts: tier3 caps at 99 visually unless TRUE (100)
function dispPts(pts, tier) {
  return tier === 3 && pts > 99 ? 100 : pts;
}
function mColor(pts, tier) {
  const r = mRank(pts, tier);
  if (tier === 3 && r === 4) return "#ff88ff";
  if (tier === 4) return ["#333355", "#44aaff", "#ffd700"][r] || "#ffd700";
  return ["#333355", "#888aaa", "#44aaff", "#ffd700"][Math.min(r, 3)];
}
function getMM(pts, tier) {
  const r = mRank(pts, tier);
  const t = {
    1: [0.55, 0.75, 0.88, 1.0],
    2: [0.50, 0.68, 0.85, 1.0],
    3: [0.45, 0.65, 0.82, 0.98, 1.15],
    4: [0.35, 0.65, 1.0]
  };
  return (t[tier] || t[1])[r] != null ? (t[tier] || t[1])[r] : 1.0;
}

// Tier4試練イベントID一覧（条件チェック用）
const TRIAL_EVENT_IDS = [
  "kensei_trial",
  "hyakuju_trial",
  "heroking_trial",
  "oracle_trial",
  "fateobserver_trial",
  "conqueror_trial",
  "necromancer_trial",

// 試練条件チェック → pendingTrialsにキューイング
function checkAndQueueTrials(c, jm) {
  let nc = c;
  const pending = [...(nc.pendingTrials || [])];
  for (const evId of TRIAL_EVENT_IDS) {
    // 既にキュー済み・達成済み・eventLog済みはスキップ
    if (pending.includes(evId)) continue;
    if (nc.eventLog && nc.eventLog.includes(evId)) continue;
    const ev = ADVENTURE_EVENTS.find(function(e){ return e.id === evId; });
    if (!ev || !ev.triggerCondition) continue;
    if (ev.triggerCondition(nc, jm)) {
      pending.push(evId);
    }
  }
  return {...nc, pendingTrials: pending};
}

function addApt(char, key, value) {
  const apt = {...(char.apt || { knowledge:0, faith:0, adventure:0, story:0, monster:0 })};
  apt[key] = (apt[key] || 0) + (value || 0);
  return {...char, apt};
}

function calcSoulBonus(char, hist) {
  const bonus = { atk: 0, def: 0, mag: 0, spd: 0, hp: 0, mp: 0, luc: 0, gold: 0, exp: 0 };
  const slots = char.soulSlots || [];
  const resonance = char.resonance || {};
  hist = hist || [];
  const CAP = 0.20; // ステータス系の合計上限20%
  slots.forEach(function(slot) {
    if (!slot.soulId) return;
    const soul = [...STARTER_SOULS, ...hist].find(function(h) { return h.soulId === slot.soulId; });
    if (!soul) return;
    const res = (resonance[slot.soulId] || 0) / 100; // 0.0〜1.0
    const table = SOUL_BONUS_TABLE[soul.job] || {};
    Object.keys(table).forEach(function(stat) {
      bonus[stat] = (bonus[stat] || 0) + table[stat] * res;
    });
  });
  // 上限適用（atk/def/mag/spdのみ）
  ["atk","def","mag","spd"].forEach(function(s) {
    if (bonus[s] > CAP) bonus[s] = CAP;
  });
  return bonus;
}

const ELEM_STRONG = {

  wind: "earth",
  earth: "water",

};
const ELEM_WEAK = {
  fire: "water",
  wind: "fire",
  earth: "wind",
  water: "earth",
  light: "dark",
  dark: "light"
};
function getElementMult(atkElem, atkExtra, defElem, defExtra) {
  // Count advantage/disadvantage pairs
  let score = 0;
  const atkElems = [atkElem, atkExtra].filter(Boolean);
  const defElems = [defElem, defExtra].filter(Boolean);
  for (const ae of atkElems) {
    for (const de of defElems) {
      if (ELEM_STRONG[ae] === de) score++;
      if (ELEM_WEAK[ae] === de) score--;
    }
  }
  if (score >= 1) return 1.2;   // 有利
  if (score <= -1) return 0.8;  // 不利
  return 1.0;
}

// ── INHERITED SKILL EFFECTS ────────────────────────────────────────────

function calcInheritedBonus(inheritedSkills) {
  const b = {
    atkPct: 0, magPct: 0, spdPct: 0, dmgRed: 0, evasion: 0, expPct: 0,
    lucFlat: 0, allPct: 0, hpRegen: 0, mpCostRed: 0, cfDaily: 0,
    lowHpAtk: 0, curseChance: 0, lifesteal: 0, gladBonus: 0, healBoost: 0,
    enemyAtkRed: 0, trueAllPct: 0, trueAtkPct: 0, trueMagPct: 0,
    trueLifesteal: 0, trueCfDaily: 0, trueHpRegen: 0, mastery: 0,
    explorerEye: 0,
    ninjaFirst: 0,
    lowHpRegen: 0,
    legendDmgBonus: 0,
    mpBurnMag: 0,
    necroStack: 0,
    instakill: 0, doubleMag: 0,
    warlordPreempt: 0,
    skillMagPct: 0,
    evadeCounterPct: 0,
    lowHpDmgRed: 0,
    arcbladeBonus: 0,
    assassinFirst: 0,
    aliHealBonus: 0,
    guardianAngel: 0,
    bloodThirst: 0
  };
  for (const key of Object.keys(inheritedSkills || {})) {
    const ms = MS[key];
    if (ms && ms.eff) {
      const {t, v} = ms.eff;
      if (b[t] !== undefined) b[t] += v;
    }
    const tms = TRUE_MS[key] ? TRUE_MS[key] : (key.endsWith('_true') ? TRUE_MS[key.replace('_true','')] : null);
    if (tms && tms.eff) {
      const {t, v} = tms.eff;
      const tk = 'true' + t.charAt(0).toUpperCase() + t.slice(1);
      if (b[tk] !== undefined) b[tk] += v;
      else if (b[t] !== undefined) b[t] += v;
    }
  }
  return b;

  if (rank >= 2) return jobId + "_pro";  // PRO = rank2
  return null;
}

function jTier(jobId) {
  return JOBS[jobId] ? JOBS[jobId].tier : 1;
}
function jRank(jobId, jm) {
  return mRank((jm[jobId] || 0), jTier(jobId));
}

function canSwitch(jobId, char, jm) {
  if (jobId === char.currentJob) return false;
  const r = JOBS[jobId].req;
  // 他の初期ジョブはstartJobがPRO(rank2)になるまで封印
  if (!r && jobId !== char.startJob) {
    const startPts = jm[char.startJob] || 0;
    if (mRank(startPts, 1) < 2) return false;
  }
  if (!r) return true;
  if (r.jobs) for (const _ref of r.jobs) {
    const job = _ref.job;
    const minRank = _ref.minRank;
    if (jRank(job, jm) < minRank) return false;

  const shuffled = [...types].sort(() => Math.random() - 0.5);

  for (let y = 0; y < H; y++) {
    const row = [];
    for (let x = 0; x < W; x++) {

      if (x === 0 && y === 0) type = "start";else if (x === W - 1 && y === H - 1) type = "boss";else type = shuffled[ti++] || "battle";

        revealed: x === 0 && y === 0 || x <= 1 && y === 0 || x === 0 && y <= 1

  const _hpMult = day <= 25 ? 0.65 : day <= 50 ? 0.82 : 1.0;

async function saveHistory(record) {
  console.log("[HoS保存]", JSON.stringify(record, null, 2));
  try {
    const existing = localStorage.getItem("lgm_history");
    const arr = existing ? JSON.parse(existing) : [];
    // 重複防止：同名・同日・同endingのレコードが既にあればスキップ
    const isDuplicate = arr.some(r =>
      r.name === record.name &&
      r.date === record.date &&
      r.ending === record.ending &&
      r.level === record.level
    );
    if (isDuplicate) return;
    arr.unshift(record);
    localStorage.setItem("lgm_history", JSON.stringify(arr.slice(0, 50)));
  } catch (e) {
    console.error("History save error:", e);
  }
}

function makeEmptyRecords() {
  return {
    jobs: {},
    newJobs: [],
    stats: {
      totalRuns: 0, totalWins: 0, totalLosses: 0,
      totalDays: 0, bossKills: {mid:0, final:0},

      highestAli: 50, lowestAli: 50,
      highestCf: 50,
      lastJob: null,
      proCount: 0, masCount: 0
    }
  };
}
async function loadRecords() {
  try {
    const raw = localStorage.getItem("lgm_records");
    if (!raw) return makeEmptyRecords();
    return JSON.parse(raw);
  } catch(e) { return makeEmptyRecords(); }
}
async function saveRecords(rec) {
  try { localStorage.setItem("lgm_records", JSON.stringify(rec)); } catch(e) {}
}
async function updateRecordJobRank(jobId, rank) {
  const rec = await loadRecords();
  const j = rec.jobs[jobId] || {runs:0, proReached:false, masReached:false, wins:0, losses:0, highestLevel:0};
  const wasNewUnlock = !j.proReached && rank >= 2;
  if (rank >= 2) j.proReached = true;
  if (rank >= 3) j.masReached = true;
  rec.jobs[jobId] = j;
  // NEW追跡
  if (wasNewUnlock) {
    if (!rec.newJobs) rec.newJobs = [];
    if (!rec.newJobs.includes(jobId)) rec.newJobs.push(jobId);
  }
  // PRO/MAS count update
  rec.stats.proCount = Object.values(rec.jobs).filter(j=>j.proReached).length;
  rec.stats.masCount = Object.values(rec.jobs).filter(j=>j.masReached).length;
  await saveRecords(rec);
}
async function updateRecordOnEnd(char, jm, isWin, day) {
  const rec = await loadRecords();
  rec.stats.totalRuns = (rec.stats.totalRuns||0) + 1;
  if (isWin) rec.stats.totalWins = (rec.stats.totalWins||0) + 1;
  else rec.stats.totalLosses = (rec.stats.totalLosses||0) + 1;
  rec.stats.totalDays = (rec.stats.totalDays||0) + (day||0);
  rec.stats.maxLevel = Math.max(rec.stats.maxLevel||0, char.level||0);
  rec.stats.highestAli = Math.max(rec.stats.highestAli||50, char.ali||50);
  rec.stats.lowestAli = Math.min(rec.stats.lowestAli!=null?rec.stats.lowestAli:50, char.ali||50);
  rec.stats.highestCf = Math.max(rec.stats.highestCf||50, char.cf||50);
  rec.stats.lastJob = char.currentJob || null;
  // 転職数（masteryが1以上のジョブ数）
  const jKeys = Object.keys(jm||{}).filter(k => (jm[k]||0) > 0);
  rec.stats.totalJobChanges = (rec.stats.totalJobChanges||0) + jKeys.length;
  // 使用ジョブ記録
  jKeys.forEach(k => {
    if (!rec.jobs[k]) rec.jobs[k]={runs:0,proReached:false,masReached:false,wins:0,losses:0,highestLevel:0};
    rec.jobs[k].runs=(rec.jobs[k].runs||0)+1;
    if (isWin) rec.jobs[k].wins=(rec.jobs[k].wins||0)+1;
    else rec.jobs[k].losses=(rec.jobs[k].losses||0)+1;
    rec.jobs[k].highestLevel=Math.max(rec.jobs[k].highestLevel||0, char.level||0);
  });
  // PRO/MAS達成数
  rec.stats.proCount = Object.values(rec.jobs).filter(j=>j.proReached).length;
  rec.stats.masCount = Object.values(rec.jobs).filter(j=>j.masReached).length;
  // 最多ジョブ
  const sorted = Object.entries(rec.jobs).sort((a,b)=>(b[1].runs||0)-(a[1].runs||0));
  rec.stats.favJob = sorted.length > 0 ? sorted[0][0] : null;
  await saveRecords(rec);
}

const doAction = async actionId => {
    if (loading || phase !== "main") return;
    // Day limit reached - must fight boss (only if haven't beaten mid-boss yet)
    if (day >= maxDays && maxDays <= 100) {
      const prepActions = ["jobs","shop","skills","skillEquip","equipment"];
      if (!prepActions.includes(actionId)) {
        pushLog("\u9B54\u738B\u8A0E\u4F10\u306E\u6642\uFF01\u6E96\u5099\u3092\u6574\u3048\u308D\uFF01", "danger");
        setTimeout(()=>setPhase("midBossSelect"),0); return;
      }
    }
    setLoading(true);
    try {
    let c = {
        ...char
      },
      j = {
        ...jm
      },
      expGain = 0;
    const lvUps = [];
    // Condition/success check
    const _lucBonus = c.inheritedSkills && c.inheritedSkills.gambler || false;
    const sr = getSuccessRate(c.hunger, _lucBonus);
    const success = Math.random() < sr;
    if (!success && actionId !== "eat") {
      const cl = getCondLabel(c.hunger);
      pushLog(`😓 [${cl.lb}] 体調不良で${actionId === "train" ? "訓練" : "修練"}が失敗した…`, "danger");
      c.hunger = Math.max(0, c.hunger - 5);
      setChar(c);
      setDay(d => d + 1);
      setLoading(false);
      return;
    }
    const cjTier = JOBS[c.currentJob].tier;
    const prevRank = mRank(j[c.currentJob] || 0, cjTier);
    j = addMastery(c.currentJob, actionId, j);
    const newRank = mRank(j[c.currentJob] || 0, cjTier);
    if (newRank > prevRank) pushLog(`✨ ${JOBS[c.currentJob].name}の習熟度: ${mLabel(j[c.currentJob] || 0, cjTier)}！`, "level");
    // Check master skill
    c = checkMasterSkill(c.currentJob, j[c.currentJob] || 0, j, c);

    // Inherited bonuses
    const ib = calcInheritedBonus(c.inheritedSkills || {});

    // タッグ修行チェック
    const tagPartners = getTagPartners(partyMembers, actionId);
    const tagFired = tagPartners.length > 0 && Math.random() < 0.25;
    if (tagFired) {
      const tp = tagPartners[0];
      const tb = TAG_BONUS[actionId];
      if (tb) {
        if (tb.atk) {
          c.atk += tb.atk;
        }
        if (tb.mag) {
          c.mag += tb.mag;
        }
        if (tb.exp) {
          expGain += tb.exp || 0;
        }
        if (tb.cf) {
          c.cf = Math.min(100, c.cf + (tb.cf || 0));
        }
        if (tb.hp) {
          c.hp = Math.min(c.maxHp, c.hp + (tb.hp || 0));
        }
        if (tb.hunger) {
          c.hunger = Math.min(100, c.hunger + (tb.hunger || 0));
        }
        if (tb.happiness) {
          c.happiness = Math.min(100, c.happiness + (tb.happiness || 0));
        }
        j = addMastery(c.currentJob, actionId, j);
        j = addMastery(c.currentJob, actionId, j); // 習熟+2
        pushLog(tb.label + " " + tp.name + "とタッグ修行！", "event");
      }
    }

    // タッグ修行チェック
    switch (actionId) {
      case "train":
        {
          const _atkPre = c.atk,
            _defPre = c.def;
          const _atkGain = Math.floor(Math.random() * 3) + 1;
          const _defGain = Math.floor(Math.random() * 2) + 1;
          c.atk = Math.min(9999, c.atk + _atkGain);
          c.def = Math.min(9999, c.def + _defGain);
          if (ib.atkPct > 0) c.atk = Math.min(9999, c.atk + Math.floor(c.atk * (ib.atkPct / 200)));
          // 忍者系は特訓でSPD上がりやすい（忍者30%、影忍50%、TRUE MASTER後50%）
          const _ninjaJob = ["ninja", "kagenin"].includes(c.currentJob);
          const _trueMaster = (j[c.currentJob] || 0) >= 100;
          const _spdRate = _ninjaJob ? c.currentJob === "kagenin" || _trueMaster ? 0.50 : 0.30 : 0.10;
          const _spdGain = Math.random() < _spdRate ? 1 : 0;
          if (_spdGain) c.spd = Math.min(999, c.spd + 1);
          c.hunger = Math.max(0, c.hunger - 15);
          c.hp = Math.max(1, c.hp - 5);
          expGain = 20;
          {
            const g = SP_GAINS.train,
              sp = c.skillPoints || {};
            c.skillPoints = {
              gouriki: (sp.gouriki || 0) + g.gouriki,
              shippuu: (sp.shippuu || 0) + g.shippuu,
              gikou: (sp.gikou || 0) + g.gikou,
              eichi: sp.eichi || 0,
              konryoku: sp.konryoku || 0
            };

                      pushLog(job.emoji+job.name+"に転職!","level");
                      // 図鑑解放
                      loadRecords().then(rec=>{
                        if(!rec.jobs[id]) rec.jobs[id]={runs:0,wins:0,losses:0,highestLevel:0};
                        rec.jobs[id].runs=(rec.jobs[id].runs||0)+1;
                        if(!rec.newJobs) rec.newJobs=[];
                        if(!rec.newJobs.includes(id)) rec.newJobs.push(id);
                        if(!rec.stats) rec.stats={};
                        rec.stats.totalJobChanges=(rec.stats.totalJobChanges||0)+1;
                        rec.stats.lastJob=id;
                        saveRecords(rec).catch(()=>{});
                      }).catch(()=>{});
                      setPhase(prevPhase||"main");
                    },
                    style:{
                      background:isCur?"#1a1a00":can?"#0a0a18":"#06060f",
                      border:"1px solid "+(isCur?"#ffd700":can?TC[tier]+"88":"#1a1a2a"),
                      borderRadius:4,padding:"5px 8px",
                      color:isCur?"#ffd700":can?TC[tier]:"#333355",
                      fontFamily:'"VT323",monospace',fontSize:15,
                      opacity:can||isCur?1:0.5,
                      cursor:can||isCur?"pointer":"default",
                      textAlign:"left",lineHeight:1.3
                    }
                  },
                    React.createElement("div",null,job.emoji+" "+job.name),
                    pts>0&&React.createElement("div",{style:{fontSize:13,
                      color:isCur?"#ffd70099":can?TC[tier]+"99":"#222244"}},
                      rankLbl+progStr)
                  );
                })
              )
            )
          ),
          React.createElement("div",{style:{height:20}}) // 下余白
        ),
        React.createElement("button",{onClick:()=>setPhase(prevPhase||"main"),
          style:{...BTN("#888aaa"),width:"100%",padding:10,flexShrink:0,borderRadius:0,borderTop:"1px solid #1a1a3a"}},
          "← 戻る")
      )
    );
  }

  if (phase === "doctor" || phase === "shrine" || phase === "companion" || phase === "doctor") {
    // 神社・医者・仲間イベントの選択肢
    const shrineChoices = {
      shrine: {
        title: "\u9B42\u306E\u795E\u793E",
        emoji: "\u26E9\uFE0F",
        text: "\u53E4\u3044\u795E\u793E\u304C\u5C71\u306E\u4E2D\u306B\u5EB7\u3063\u305F\u3002\n\u5BA3\u4F2B\u304C\u8A9E\u308A\u304B\u3051\u3066\u304F\u308B\u3002",
        choices: [
          {text:"\u795E\u306B\u305D\u306E\u9B42\u3092\u54B2\u3048\u308B",effect:(c)=>({...c,ali:Math.min(100,c.ali+12),hp:Math.min(c.maxHp,c.hp+30)}),desc:"ALIGN+12 HP+30"},
          {text:"\u529B\u3092\u5C01\u5370\u3059\u308B\u5100\u5F0F",effect:(c)=>({...c,cf:Math.min(100,c.cf+10),mag:c.mag+3}),desc:"LEGEND+10 MAG+3"},
          {text:"\u9759\u304B\u306B\u53BB\u308B",effect:(c)=>c,desc:"\u9AD8\u307E\u306B\u540C\u308C\u305F\u3002"}
        ]
      },
      doctor: {
        title: "\u8B0E\u306E\u8CE2\u7165\u8853\u5E2B",
        emoji: "\u2697\uFE0F",
        text: "\u600E\u308A\u306A\u6C17\u214C\u3044\u8CE2\u7165\u8853\u5E2B\u304C\u5C45\u308B\u3002\n\u300C\u8C4A\u304B\u306A\u4EE3\u511F\u3092\u6255\u3048\u3070\u80FD\u529B\u3092\u5F15\u304D\u51FA\u3057\u3066\u3084\u308D\u3046\u300D",
        choices: [
          {text:"\u8AB2\u91D1\u3059\u308B\uFF08100G\uFF09",cost:100,effect:(c)=>({...c,atk:c.atk+5,def:c.def+3,gold:(c.gold||0)-100}),desc:"ATK+5 DEF+3"},
          {text:"\u8AB2\u91D1\u3059\u308B\uFF0850G\uFF09",cost:50,effect:(c)=>({...c,hp:Math.min(c.maxHp,c.hp+c.maxHp),mp:c.maxMp,gold:(c.gold||0)-50}),desc:"HP\u30FB MP\u5B8C\u5168\u56DE\u5FA9"},
          {text:"\u65AD\u308B",effect:(c)=>c,desc:"\u6014\u308C\u305F\u3002"}
        ]
      },
      companion: {
        title: (char&&char.compMet&&Object.values(char.compMet).some(v=>v))?"\u4EBA\u306E\u7E01\u3067\u4F1A\u3063\u305F\u65C5\u4EBA":"\u4E00\u4EBA\u306E\u65C5\u4EBA",
        emoji: "\uD83E\uDDD1",
        text: "\u65C5\u4EBA\u304C\u58F0\u3092\u304B\u3051\u3066\u304D\u305F\u3002\n\u308F\u305A\u304B\u306A\u7E41\u304C\u308A\u3092\u611F\u3058\u308B\u3002",
        choices: [
          {text:"\u8A71\u3092\u8074\u304F",effect:(c)=>({...c,cf:Math.min(100,c.cf+8),luc:c.luc+2}),desc:"LEGEND+8 LUC+2"},
          {text:"\u98DF\u4E8B\u3092\u5206\u3051\u308B",effect:(c)=>({...c,ali:Math.min(100,c.ali+8),hunger:Math.min(100,(c.hunger||50)+15)}),desc:"ALIGN+8 \u6E80\u8179+15"},
          {text:"\u7D9A\u304D\u3092\u6B69\u3080",effect:(c)=>c,desc:"\u9759\u304B\u306B\u5225\u308C\u305F\u3002"}
        ]
      }
    };
    const ev = shrineChoices[phase] || shrineChoices.shrine;
    return React.createElement("div",{style:ROOT},
      React.createElement("div",{style:{width:"100%",maxWidth:460}},
        React.createElement("div",{style:{...PX(10),color:"#ffd700",textAlign:"center",marginBottom:8}},
          ev.emoji+" "+ev.title),
        React.createElement("div",{style:{...PANEL,marginBottom:12}},
          React.createElement("div",{style:{...VT,fontSize:17,color:"#d0d0f8",lineHeight:1.8,whiteSpace:"pre-line"}},
            ev.text)
        ),
        ev.choices.map((ch,i)=>
          React.createElement("button",{key:i,
            onClick:()=>{
              if(ch.cost>0&&(char.gold||0)<ch.cost){pushLog("\u30B4\u30FC\u30EB\u30C9\u4E0D\u8DB3\uFF01("+ch.cost+"G\u5FC5\u8981)","danger");return;}
              try{const nc=ch.effect({...char});setChar(nc);}catch(e){}
              pushLog(ev.emoji+" "+ev.title+": "+ch.desc,"event");
              setTimeout(()=>setPhase("main"),0);
            },
            style:{...BTN(ch.cost>0?"#c0902a":"#5060a0"),width:"100%",padding:12,marginBottom:6,
              display:"flex",justifyContent:"space-between",alignItems:"center"}},
            React.createElement("span",{style:{...PX(8)}},ch.text),
            ch.cost>0&&React.createElement("span",{style:{...VT,fontSize:15,color:"#ffd700"}},ch.cost+"G")
          )
        )
      )
    );
  }

  // ── MAIN SCREEN (default) ─────────────────────────────────────────────
  if (!char) {
    return React.createElement("div",{style:{...ROOT,justifyContent:"center",alignItems:"center"}},
      React.createElement("div",{style:{color:"#555577",...VT,fontSize:20}},"\u8AAD\u307F\u8FBC\u307F\u4E2D...")
    );
  }
  const ib2 = calcInheritedBonus(char.inheritedSkills||{});
  const cjob = JOBS[char.currentJob]||JOBS.warrior;
  const cjLabel = mLabel(jm[char.currentJob]||0, cjob.tier);
  const tagParts = getTagPartners(partyMembers, null);
  const ms2 = MS[char.currentJob];
  return React.createElement("div",{style:ROOT},
    React.createElement("div",{style:{width:"100%",maxWidth:460}},
      // キャラ情報
      React.createElement("div",{style:{...PANEL,padding:"10px 12px",marginBottom:8}},
        React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}},
          React.createElement("div",null,
            React.createElement("div",{style:{...PX(9),color:"#e0e0ff"}}, (ELEM_EMOJI[char.element]||"🔥")+" "+cjob.emoji+" "+char.name),
            React.createElement("div",{style:{...VT,fontSize:17,color:"#aaaacc"}}, (() => {
          const _pts = jm[char.currentJob]||0;
          const _isTM = cjob.tier===3 && _pts>=100;
          const _rl = _isTM?"真マスター":(cjLabel==="AMT"?"AMATEUR":cjLabel==="MAS"?"MASTER":cjLabel);
          const _dm = cjob.tier===3?99:(TIER_MAX[cjob.tier]||100);
          const _prog = "("+Math.min(_pts,_isTM?100:_dm)+"/"+(_isTM?"99★":_dm)+")";
          return cjob.name+" "+_rl+" "+_prog;
        })())
          ),
          React.createElement("div",{style:{textAlign:"right"}},
            React.createElement("div",{style:{...VT,fontSize:18,color:"#ffd700"}},"DAY "+day+"/"+maxDays),
            React.createElement("div",{style:{...VT,fontSize:15,color:"#555577"}},"Lv."+char.level+" "+char.wins+"\u52DD"+char.losses+"\u6557")
          )
        ),
        // DEVモード：資質ポイント表示
        _isDev && char && char.apt && React.createElement("div",{
          style:{...PANEL,padding:"4px 8px",marginBottom:4,fontSize:10,color:"#556677",fontFamily:"monospace"}
        },
          "DEV 資質 | 知:"+char.apt.knowledge+" 信:"+char.apt.faith+
          " 冒:"+char.apt.adventure+" 語:"+char.apt.story+" 魔:"+char.apt.monster
        ),
        // HP/MPバー
        React.createElement("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:2}},
          React.createElement("span",{style:{...VT,fontSize:14,color:"#ff4455"}},"\u2764\uFE0F "+char.hp+"/"+char.maxHp),
          React.createElement("span",{style:{...VT,fontSize:14,color:"#44aaff"}},"\uD83D\uDCA7 "+char.mp+"/"+char.maxMp)
        ),
        React.createElement("div",{style:{background:"#111122",borderRadius:3,height:8,overflow:"hidden",marginBottom:2}},
          React.createElement("div",{style:{width:char.hp/char.maxHp*100+"%",height:"100%",background:"#ff4455",borderRadius:3}})
        ),
        React.createElement("div",{style:{background:"#111122",borderRadius:3,height:6,overflow:"hidden",marginBottom:6}},
          React.createElement("div",{style:{width:char.mp/char.maxMp*100+"%",height:"100%",background:"#44aaff",borderRadius:3}})
        ),
        // 空腹バー
        React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}},
          React.createElement("span",{style:{...VT,fontSize:14,
            color:char.hunger<=20?"#ff6633":char.hunger<=50?"#ffaa44":"#44aa77"}},
            "満腹度"),
          React.createElement("span",{style:{...VT,fontSize:14,
            color:char.hunger<=20?"#ff6633":char.hunger<=50?"#ffaa44":"#44aa77"}},
            char.hunger+"/100"+(char.hunger<=0?" ―食事を！":char.hunger<=20?" ⚠空腹":""))
        ),
        React.createElement("div",{style:{background:"#111122",borderRadius:3,height:6,overflow:"hidden",marginBottom:6}},
          React.createElement("div",{style:{width:char.hunger+"%",height:"100%",transition:"width 0.3s",
            background:char.hunger<=20?"#ff6633":char.hunger<=50?"#ffaa44":"#44aa77",borderRadius:3}})
        ),
        // ステータス
        React.createElement("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
          [["ATK",char.atk],["DEF",char.def],["MAG",char.mag],["SPD",char.spd],["LUC",char.luc]].map(([k,v])=>
            React.createElement("span",{key:k,style:{...VT,fontSize:14,color:"#888aaa"}},
              React.createElement("span",{style:{color:"#555577"}},k),v)
          )
        )
      ),
      // 武器
      char.weapon&&React.createElement("div",{style:{...PANEL,padding:"6px 12px",marginBottom:8,borderColor:"#445566"}},
        React.createElement("span",{style:{...VT,fontSize:16,color:"#88aacc"}},
          "\uD83D\uDDE1\uFE0F "+(WEAPONS[char.weapon]?WEAPONS[char.weapon].emoji+" "+WEAPONS[char.weapon].name:char.weapon)
        )
      ),
      // ALIGNとLEGEND
      React.createElement("div",{style:{display:"flex",gap:6,marginBottom:8}},
        React.createElement("div",{style:{...PANEL,flex:1,padding:"6px 10px"}},
          React.createElement("div",{style:{...VT,fontSize:14,color:"#555577"}},"ALIGN"),
          React.createElement("div",{style:{...PX(8),color:char.ali>=60?"#44aaff":char.ali<=40?"#ff4455":"#aaaacc"}},
            char.ali+"  "+(char.ali>=75?"\u79E9\u5E8F":char.ali>=55?"\u4E2D\u7ACB\u30ED\u30A6":char.ali>=45?"\u4E2D\u7ACB":char.ali>=25?"\u4E2D\u7ACB\u30AB\u30AA\u30B9":"\u6DF7\u6C8C"))
        ),
        React.createElement("div",{style:{...PANEL,flex:1,padding:"6px 10px"}},
          React.createElement("div",{style:{...VT,fontSize:14,color:"#555577"}},"LEGEND"),
          React.createElement("div",{style:{...PX(8),color:"#ffd700"}},char.cf)
        )
      ),
      // ── 行動UI（カテゴリ見出し+実行ボタン）──────────────────────────
      (function(){
        const _dis = loading||(day>=maxDays&&maxDays<=100);
        const _hun = char.hunger<=0;
        const _mgmt = ["jobs","equipment","skills","引き継ぎ個性","shop","soulRoom"];
        const _actionBtn = function(label, action, color) {
          const _d = _dis && !_mgmt.includes(action);
          const _h = _hun && !["eat","rest","sleep"].concat(_mgmt).includes(action);
          return React.createElement("button",{
            key:action,
            onClick:()=>{
              if(action==="jobs"){setPrevPhase("main");setPhase("jobs");}
              else if(["equipment","skills","引き継ぎ個性","shop"].includes(action)){setPhase(action);}
              else if(action==="soulRoom"){setPhase("soulRoom");}
              else{doAction(action);}
            },
            disabled:_d,
            style:{...BTN(color,_d),padding:"10px 4px",fontSize:8,
              outline:_h?"2px solid #ff4444":"none"}
          },label);
        };
        const _hdr = function(label) {
          return React.createElement("div",{
            style:{...VT,fontSize:9,color:"#555577",textAlign:"center",
                   padding:"6px 2px 2px",pointerEvents:"none",userSelect:"none"}
          },label);
        };
        return React.createElement("div",{style:{marginBottom:6}},
          // ── 上段: カテゴリ見出し3列 ──
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4,marginBottom:2}},
            _hdr("⚔ 特訓"),
            _hdr("🌿 特別"),
            _hdr("🍺 酒場")
          ),
          // ── 中段: 実行ボタン6つ ──
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4,marginBottom:6}},
            _actionBtn("💪 修行","train","#ff8844"),
            _actionBtn("🗡️ 冒険","adventure","#ff4455"),
            _actionBtn("🍖 食事","eat","#ffaa44"),
            _actionBtn("✨ 魔法","magic","#aa88ff"),
            _actionBtn("🌙 瞑想","meditation","#6644aa"),
            _actionBtn("🛏️ 睡眠","rest","#44aa77")
          ),
          // ── 下段: 管理メニュー（日数消費なし）──
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4}},
            _actionBtn("⚔️ 装備","equipment","#334455"),
            _actionBtn("✨ 特能","skills","#33446688"),
            _actionBtn("🛒 ショップ","shop","#334433"),
            _actionBtn("👻 魂の間","soulRoom","#221133"),
            _actionBtn("🏛️ ジョブ","jobs","#33446699"),
            React.createElement("div",null)
          )
        );
      })(),
      // 引き継ぎ個性ボタン
      React.createElement("button",{
        onClick:()=>setPhase("skillEquip"),
        style:{...BTN("#ff884488"),width:"100%",padding:8,marginBottom:8,fontSize:8}
      },"\uD83D\uDCDA \u30B9\u30AD\u30EB\u88C5\u5099 ("+(char.equippedSkills||[]).length+"/6)"),
      // 仲間
      partyMembers&&partyMembers.length>0&&React.createElement("div",{style:{...PANEL,padding:8,marginBottom:8}},
        React.createElement("div",{style:{...VT,fontSize:15,color:"#555577",marginBottom:4}},"\uD83E\uDD1D \u4EF2\u9593"),
        React.createElement("div",{style:{display:"flex",gap:6}},
          partyMembers.map((p,i)=>p&&React.createElement("span",{key:i,style:{...VT,fontSize:16,color:"#aaaacc"}},
            (JOBS[p.currentJob]&&JOBS[p.currentJob].emoji||"\uD83E\uDD35")+" "+p.name))
        )
      ),
      // ログ
      char&&char.items&&Object.keys(char.items).some(k=>(char.items[k]||0)>0)&&
        React.createElement("div",{style:{...PANEL,padding:8,marginBottom:8}},
          React.createElement("div",{style:{...VT,fontSize:14,color:"#888aaa",marginBottom:6}},"アイテム"),
          React.createElement("div",{style:{display:"flex",flexWrap:"wrap",gap:4}},
            Object.entries(char.items||{}).filter(([,n])=>(n||0)>0).map(([k,n])=>{
              const it=SHOP_ITEMS[k];if(!it)return null;
              return React.createElement("button",{key:k,
                onClick:()=>{
                  if(!it||loading)return;
                  let nc={...char};
                  if(it.hpHeal)nc.hp=Math.min(nc.maxHp,nc.hp+(it.hpHeal||0));
                  if(it.mpHeal)nc.mp=Math.min(nc.maxMp,nc.mp+(it.mpHeal||0));
                  nc.items={...nc.items,[k]:Math.max(0,(nc.items[k]||1)-1)};
                  setChar(nc);
                  pushLog(it.emoji+" "+it.name+"を使った！"+it.desc,"event");
                },
                style:{...BTN("#226644"),padding:"4px 10px",fontSize:14,opacity:loading?0.5:1}
              },it.emoji+" "+it.name+" ×"+n);
            })
          )
        ),
React.createElement("div",{
        id:"battleLogBox",
        style:{...PANEL,padding:8,background:"#08080f",border:"1px solid #111122",
               marginBottom:8,maxHeight:160,overflowY:"auto",
               scrollBehavior:"smooth"}
      },
        (log||[]).slice(-50).map((l,i)=>
          React.createElement("div",{key:l.id||i,style:{...VT,fontSize:14,
            color:l.type==="level"?"#ffd700":l.type==="danger"?"#ff4455":l.type==="event"?"#44cc77":"#aaaacc",
            padding:"3px 0",borderBottom:"1px solid #0a0a1a"}},l.text)
        )
      )
    )
  );

}
window.onerror = function(msg,src,line,col,err){
  document.getElementById('root').innerHTML =
    '<div style="color:#ff4455;padding:20px;font-family:monospace;white-space:pre-wrap;background:#0a0010;min-height:100vh">' +
    '<b>ERROR:</b><br>' + msg + '<br>Line:' + line + ' Col:' + col +
    '<br><small>' + (src||'') + '</small>' +
    '<br><small>' + (err&&err.stack?err.stack.slice(0,300):'') + '</small></div>';
};
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAVE SOUL ～魂の試練～</title><style>body{margin:0;background:#0a0a18;color:#ddd;font:18px sans-serif;text-align:center;padding:36px 12px}button{padding:12px}</style></head>
<body><main id="status" role="status">⚔️ BRAVE SOUL 起動中…</main>
<script>
(async function(){
  try {
    const response=await fetch('./legacy.html',{cache:'no-store'});
    if(!response.ok)throw new Error('ゲーム本体の読み込みに失敗 ('+response.status+')');
    let source=await response.text();
    // GitHub Pages hotfix 0.3: preserve legacy game and user saves.
    // Only use latest job mastery value, not stale React state.
    const stale='(jm[c.currentJob] || 0) === 99 && (j[c.currentJob] || 0) === 99';
    const fixes=[
      [stale,'(j[c.currentJob] || 0) === 99',2],
      ['currentJob: jobId,\n      allInMissedThisBattle: false,\n      trueActionProgress: {}','currentJob: jobId,\n      allInMissedThisBattle: false,\n      trueActionProgress: c.trueActionProgress || {}',1],
      ['let _nc = {...char, currentJob: id, allInMissedThisBattle: false, trueActionProgress: {}}','let _nc = {...char, currentJob: id, allInMissedThisBattle: false, trueActionProgress: char.trueActionProgress || {}}',1],
      ['rest: "瞑想",','rest: "睡眠",',1],
      ['"⚡ 限界の境地…真の覚醒まであと" + (total - done) + "回"','"⚡ TRUE進捗 " + Object.entries(cond).map(([key,need])=>(key==="train"?"特訓":key==="rest"?"睡眠":key==="adventure"?"冒険":key==="magic"?"魔法":key==="eat"?"食事":key)+" "+Math.min(jobSP[key]||0,need)+"/"+need).join("・")',1],
      ['`⚡ 限界の境地…真の覚醒まであと${total - done}回`','`⚡ TRUE進捗 ${Object.entries(cond).map(([key,need])=>(key==="train"?"特訓":key==="rest"?"睡眠":key==="adventure"?"冒険":key==="magic"?"魔法":key==="eat"?"食事":key)+" "+Math.min(jobSP[key]||0,need)+"/"+need).join("・")}`',1],
      ['const text = await callAI(','const text = await (async () => null)(',1],
      ['if (finishGame._called) return; finishGame._called = true;','if (finishGame._called && (phase === "midBossPrep" || phase === "finalBossPrep")) return; finishGame._called = true;',1],
      ['    setPhase("main");\n  };\n\n  // ── CREATION','    setPhase((data.day || 1) >= (data.maxDays || 100) ? ((data.maxDays || 100) <= 100 ? "midBossPrep" : "finalBossPrep") : "main");\n  };\n\n  // ── CREATION',1],
      ['setPhase(sv.bossState?"midBossSelect":"main");','setPhase(sv.bossState?"midBossSelect":((sv.day||1)>=(sv.maxDays||100)?((sv.maxDays||100)<=100?"midBossPrep":"finalBossPrep"):"main"));',1],
      ['  // ── MAIN SCREEN (default) ─────────────────────────────────────────────','  // Day-limit safety: a visible boss entry even when an old save resumes on the main screen.\\n  if (char && phase === "main" && day >= maxDays) {\\n    return React.createElement("div",{style:{...ROOT,justifyContent:"center",gap:18}},\\n      React.createElement("div",{style:{...PANEL,textAlign:"center",fontSize:22,color:"#e8d6a2"}},"⚔️ DAY "+day+" / "+maxDays+"　試練の時"),\\n      React.createElement("button",{style:{...BTN("#e8b66c"),minHeight:64,fontSize:22,width:"100%",maxWidth:560},onClick:()=>setPhase(maxDays<=100?"midBossPrep":"finalBossPrep")},"⚔️ ボス戦へ進む"),\\n      React.createElement("div",{style:{fontSize:17,color:"#b7bbc9"}},"セーブデータはそのまま。準備画面で職業を変更できます。"));\\n  }\\n  // ── MAIN SCREEN (default) ─────────────────────────────────────────────',1],
      ['setSecretProgress({});','setSecretProgress(char.trueActionProgress || {});',2]
    ];
    for(const [before,after,expected] of fixes){
      const count=source.split(before).length-1;
      if(count!==expected)throw new Error('修正対象が一致しません（'+count+'/'+expected+'）。安全のため起動を停止しました。');
      source=source.split(before).join(after.replace(/\\n/g, '\n'));
    }
    // P1 Dark Ritual visual skin; game state and logic remain unchanged.
    if(!source.includes('</head>'))throw new Error('HTML head not found');
    source=source.replace('</head>','<link rel="stylesheet" href="./ui/dark-ritual-v1.css?v=1"></head>');
    document.open();
    document.write(source);
    document.close();
  }catch(err){
    document.getElementById('status').textContent='起動失敗: '+String(err.message||err);
  }
})();
</script></body></html>
